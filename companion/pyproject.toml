[project]
name = "racer_companion"
version = "0.1.0"
description = "Betaflight + autonomous nav companion for race drones"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "hypothesis>=6.100", "pymavlink>=2.4"]

[project.scripts]
racer-companion = "racer_companion.main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["racer_companion*"]
